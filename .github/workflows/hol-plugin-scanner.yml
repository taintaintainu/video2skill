name: HOL Plugin Scanner

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Scan plugin
        # v1.2.536, pinned to plugin-scanner 2.2.125 as required by the
        # awesome-codex-plugins contribution guide.
        uses: hashgraph-online/ai-plugin-scanner-action@e0f4fdf0a0bb1027f5419a4732c7357bdff2561c
        with:
          plugin_dir: "."
          mode: scan
          min_score: 80
          fail_on_severity: high
          format: sarif
          upload_sarif: true
